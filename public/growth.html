<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UNIQUE BRAVE — Growth Centre</title><link rel="stylesheet" href="/app.css"><style>body{margin:0;background:#f7f3fb;color:#24162f;font-family:Arial}.top{background:linear-gradient(135deg,#32105f,#7027c8);color:#fff;padding:16px 5%;display:flex;justify-content:space-between}.top a{color:#ffd83d;text-decoration:none;font-weight:800}.wrap{max-width:1100px;margin:auto;padding:24px 5%}.card{background:#fff;border:1px solid #eadff2;border-radius:20px;padding:20px;margin-top:15px}.bar{height:14px;background:#eee3f8;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:#ffd83d}.btn{border:0;border-radius:11px;padding:11px 14px;background:#ffd83d;font-weight:900;cursor:pointer}.muted{color:#75697e}</style></head><body><header class="top"><b>🦁 UNIQUE BRAVE · Growth Centre</b><a href="/dashboard.html">My BRAVE</a></header><main class="wrap"><div id="app"><div class="card">Loading your private business metrics…</div></div></main><script>
const token=()=>localStorage.getItem('braveToken')||'';async function load(){const [a,b]=await Promise.all([fetch('/api/account/business-summary',{headers:{Authorization:'Bearer '+token()},credentials:'include'}),fetch('/api/account/reputation',{headers:{Authorization:'Bearer '+token()},credentials:'include'})]);if(!a.ok){app.innerHTML='<div class="card"><h2>Sign in to see your growth centre.</h2><a class="btn" href="/login.html">Login</a></div>';return}const d=await a.json(),r=await b.json();const score=Math.min(100,d.products*12+d.services*12+d.customers*8+d.records*5+d.designs*5+d.messages*2);app.innerHTML=`<div class="card"><h1>Your growth dashboard</h1><p class="muted">These figures belong only to your BRAVE account.</p><h3>Business activity</h3><div class="bar"><i style="width:${score}%"></i></div><p>${score}% activity progress</p></div><div class="card"><h2>Reputation signals</h2><p>Products: <b>${r.products}</b> · Services: <b>${r.services}</b> · Posts: <b>${r.posts}</b> · Reviews: <b>${r.reviews}</b> · Rating: <b>${Number(r.rating||0).toFixed(1)}/5</b></p><p class="muted">Use clear listings, accurate descriptions, reliable communication and completed orders to build customer confidence.</p></div><div class="card"><h2>Next actions</h2><button class="btn" onclick="location.href='/creative-designs.html'">Create marketing design</button> <button class="btn" onclick="location.href='/products.html'">Improve products</button> <button class="btn" onclick="location.href='/services.html'">Improve services</button></div>`}load()
</script></body></html>
