<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UNIQUE BRAVE Profile</title><style>body{font-family:Arial;background:#f7f3fb;margin:0;color:#24162f}header{background:#32105f;color:#fff;padding:20px}.wrap{max-width:900px;margin:25px auto;padding:0 15px}.profile{background:#fff;border-radius:22px;padding:25px;box-shadow:0 8px 30px #32105f12}.cover{height:180px;background:linear-gradient(135deg,#32105f,#a35bea);border-radius:18px;object-fit:cover;width:100%}.profile-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.statline{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px}.timeline-card{background:#fff;border-radius:18px;padding:16px;box-shadow:0 5px 20px #32105f0b}.avatar{width:100px;height:100px;border-radius:50%;object-fit:cover;background:#ffd83d}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.card{background:#fff;border:1px solid #eadff1;border-radius:18px;padding:18px}.media{max-width:100%;max-height:350px;border-radius:15px}@media(max-width:650px){.cards{grid-template-columns:1fr}}.profile-share{overflow-wrap:anywhere;background:#f7f1fb;border:1px solid #eadff2;border-radius:14px;padding:12px}.profile-share a{font-weight:800}
</style><link rel="stylesheet" href="/app.css"><link rel="manifest" href="/manifest.json"></head><body><header>🦁 UNIQUE BRAVE — Public Profile</header><div class="wrap"><div id="profile"></div><h2>Timeline</h2><div id="posts" class="cards"></div><h2>Products</h2><div id="products" class="cards"></div><h2>Services</h2><div id="services" class="cards"></div></div><script>const u=location.pathname.split('/').pop(),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const r=await fetch('/api/profile/'+encodeURIComponent(u));const d=await r.json();if(!r.ok)return document.body.innerHTML='<h2 style="padding:30px">Profile not found.</h2>';profile.innerHTML=`<div class="profile"><div class="cover"></div><div style="margin-top:-55px;padding-left:18px"><img class="avatar" style="width:110px;height:110px;border:5px solid #fff" src="${d.user.profileImage||'/images/brave-lion.png'}"></div><h1>${esc(d.user.fullname)}</h1><p><b>@${esc(d.user.username)}</b> · ${esc(d.user.country)} · ${esc(d.user.location||'Location not shared')}</p><p>📞 ${esc(d.user.phone||'Phone not shared')}</p><p>${d.user.verificationStatus==='verified'?'✅ Verified':'⚪ Not verified'} · ⭐ ${Number(d.user.rating||0).toFixed(1)} (${Number(d.user.ratingCount||0)})</p><div class="statline"><span>Posts <b>${d.stats.posts}</b></span><span>Likes <b>${d.stats.likes}</b></span><span>Comments <b>${d.stats.comments}</b></span><span>Views <b>${d.stats.profileViews}</b></span><span>Reviews <b>${d.stats.reviews}</b></span></div><p class="profile-share"><b>BRAVE link:</b> <a href="${esc(d.profileUrl)}">${esc(d.profileUrl)}</a></p><div class="profile-actions"><button class="btn" onclick="navigator.clipboard?.writeText('${esc(d.profileUrl)}');this.textContent='Copied'">Copy profile link</button>${d.viewerId&&d.viewerId!==d.user.id?`<button class="btn secondary" onclick="reviewProfile()">⭐ Review</button>`:''}</div></div>`;posts.innerHTML=d.posts.map(p=>`<div class="timeline-card"><b>${esc(p.fullname)}</b><small class="muted"> · ${esc(p.created_at)}</small><p>${esc(p.text)}</p>${p.media_data?(p.media_type.startsWith('video')?`<video class="media" controls src="${p.media_data}"></video>`:p.media_type.startsWith('audio')?`<audio controls style="width:100%" src="${p.media_data}"></audio>`:p.media_type==='application/pdf'?`<a class="btn secondary" href="${p.media_data}" target="_blank">📄 Open file</a>`:p.media_type.startsWith('image')?`<img class="media" src="${p.media_data}">`:`<a class="btn secondary" href="${p.media_data}" download="${esc(p.file_name||'BRAVE-file')}">📎 Download file</a>`):''}<div class="muted">👍 ${Number(p.likes||0)} likes · 💬 ${Number(p.comments?.length||0)} comments</div></div>`).join('')||'<div class="card">No public posts yet.</div>';products.innerHTML=d.products.map(p=>`<div class="card"><h3>${esc(p.name)}</h3><p>${esc(p.description)}</p></div>`).join('')||'<div class="card">No products yet.</div>';services.innerHTML=d.services.map(s=>`<div class="card"><h3>${esc(s.name)}</h3><p>${esc(s.description)}</p></div>`).join('')||'<div class="card">No services yet.</div>'}load()<script>async function reviewProfile(){const rating=Number(prompt('Rating 1-5:','5'));if(!rating)return;const review=prompt('Review:','');const r=await fetch('/api/profile/'+encodeURIComponent(u)+'/reviews',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+(localStorage.getItem('braveToken')||'')},credentials:'include',body:JSON.stringify({rating,review})});const d=await r.json();alert(d.message||'Done');if(r.ok)load()}</script><script src="/app.js"></script></body></html>
