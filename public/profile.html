<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UNIQUE BRAVE Profile</title><link rel="stylesheet" href="/app.css"><link rel="manifest" href="/manifest.json"><link rel="icon" href="/images/brave-logo.png" type="image/png"><link rel="apple-touch-icon" href="/images/brave-logo.png"></head><body class="brave-cmd-shell">
<header class="brave-cmd-header"><div style="max-width:1120px;margin:auto;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px"><a href="/marketplace.html" class="brave-cmd-brand" style="text-decoration:none"><img src="/images/brave-logo.png"><span><strong>UNIQUE BRAVE</strong><small>Your page. Your business. Your control.</small></span></a><a href="/login.html" class="brave-cmd-btn light">Open BRAVE</a></div></header>
<main style="max-width:1120px;margin:auto;padding:22px 16px 70px"><div id="profile"></div><div style="display:grid;grid-template-columns:1.15fr .85fr;gap:18px;margin-top:18px"><section><h2>Products</h2><div id="products" class="cards" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px"></div><h2 style="margin-top:26px">Services</h2><div id="services" class="cards" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px"></div></section><aside><h2>BRAVE activity</h2><div id="posts" style="display:grid;gap:12px"></div></aside></div></main>
<script>
const u=decodeURIComponent(location.pathname.split('/').pop()),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function copyLink(url,b){navigator.clipboard?.writeText(url);b.textContent='Copied ✓';setTimeout(()=>b.textContent='Copy link',1500)}
async function shareBrave(url){const r=await fetch('/api/public-share/'+encodeURIComponent(u));const d=await r.json();if(navigator.share){try{await navigator.share({title:d.title,text:d.description,url:d.url});return}catch(_){}}navigator.clipboard?.writeText(d.shareText);alert('BRAVE share text and link copied. Paste it into WhatsApp, Facebook or another platform.')}
async function load(){const r=await fetch('/api/profile/'+encodeURIComponent(u));const d=await r.json();if(!r.ok){document.body.innerHTML='<main style="padding:40px;text-align:center"><h1>BRAVE page not found</h1><a href="/marketplace.html">Back to Marketplace</a></main>';return}
const x=d.user;profile.innerHTML=`<section class="brave-cmd-panel brave-cmd-gradient" style="padding:28px"><div style="position:relative;z-index:1"><div style="display:flex;align-items:center;gap:18px;flex-wrap:wrap"><img src="${esc(x.profileImage||'/images/brave-lion.png')}" style="width:96px;height:96px;border-radius:24px;object-fit:cover;border:4px solid rgba(255,255,255,.7)" onerror="this.src='/images/brave-lion.png'"><div style="flex:1"><span class="brave-cmd-kicker gold">UNIQUE BRAVE PUBLIC PAGE</span><h1 style="margin:10px 0 5px;font-size:clamp(30px,5vw,48px)">${esc(x.fullname)}</h1><p style="margin:0;opacity:.88">@${esc(x.username)} · ${esc(x.country||'Nigeria')} · ${esc(x.location||'Location not shared')} · ${x.email?`Email: ${esc(x.email)}`:''}</p></div></div><p style="font-size:16px;line-height:1.7;max-width:760px;margin:20px 0">${esc(x.publicBio||'Welcome to my UNIQUE BRAVE page. Explore my products, services and BRAVE presence.')}</p><div style="display:flex;gap:8px;flex-wrap:wrap"><span class="brave-id-chip">Reference <b>${esc(x.braveReference||'BRV-REF')}</b></span><span class="brave-id-chip">Serial <b>${esc(x.braveSerial||'UBR-SN')}</b></span><span class="brave-id-chip">${x.verificationStatus==='verified'?'✓ Verified':'○ Member'}</span></div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:18px"><button class="brave-cmd-btn primary" onclick="shareBrave('${esc(d.profileUrl)}')">Share on WhatsApp / Social</button><button class="brave-cmd-btn light" onclick="copyLink('${esc(d.profileUrl)}',this)">Copy link</button><a class="brave-cmd-btn light" href="/marketplace.html?q=${encodeURIComponent(x.fullname)}">Find on Marketplace</a></div></div></section>`;
products.innerHTML=d.products.map(p=>`<article class="brave-cmd-panel" style="padding:14px"><img src="${esc(p.image_data||p.image_url||'/images/brave-lion.png')}" style="width:100%;height:150px;object-fit:cover;border-radius:14px"><span class="brave-listing-origin member">MEMBER LISTING</span><h3>${esc(p.name)}</h3><p style="color:#75697e">${esc((p.description||'').slice(0,130))}</p>${p.price!=null?`<b style="font-size:20px;color:#5420a2">₦${Number(p.price).toLocaleString('en-NG')}</b>`:''}</article>`).join('')||'<div class="brave-cmd-panel" style="padding:18px">No products published yet.</div>';
services.innerHTML=d.services.map(s=>`<article class="brave-cmd-panel" style="padding:14px"><img src="${esc(s.image_data||s.image_url||'/images/brave-lion.png')}" style="width:100%;height:150px;object-fit:cover;border-radius:14px"><span class="brave-listing-origin member">MEMBER SERVICE</span><h3>${esc(s.name)}</h3><p style="color:#75697e">${esc((s.description||'').slice(0,130))}</p>${s.price!=null?`<b style="font-size:20px;color:#5420a2">₦${Number(s.price).toLocaleString('en-NG')}</b>`:''}</article>`).join('')||'<div class="brave-cmd-panel" style="padding:18px">No services published yet.</div>';
posts.innerHTML=d.posts.map(p=>`<article class="brave-social-card" style="padding:16px"><b>${esc(p.fullname)}</b><small style="color:#81758f;display:block">${esc(p.created_at||'')}</small><p>${esc(p.text||'')}</p></article>`).join('')||'<div class="brave-cmd-panel" style="padding:18px">No public activity yet.</div>';
}load();
</script><script src="/app.js"></script></body></html>
