<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UNIQUE BRAVE Profile</title><style>body{font-family:Arial;background:#f7f3fb;margin:0;color:#24162f}header{background:#32105f;color:#fff;padding:20px}.wrap{max-width:900px;margin:25px auto;padding:0 15px}.profile{background:#fff;border-radius:22px;padding:25px}.avatar{width:100px;height:100px;border-radius:50%;object-fit:cover;background:#ffd83d}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.card{background:#fff;border:1px solid #eadff1;border-radius:18px;padding:18px}.media{max-width:100%;max-height:350px;border-radius:15px}@media(max-width:650px){.cards{grid-template-columns:1fr}}</style><link rel="stylesheet" href="/app.css"><link rel="manifest" href="/manifest.json"></head><body><header>🦁 UNIQUE BRAVE — Public Profile</header><div class="wrap"><div id="profile"></div><h2>Timeline</h2><div id="posts" class="cards"></div><h2>Products</h2><div id="products" class="cards"></div><h2>Services</h2><div id="services" class="cards"></div></div><script>const u=location.pathname.split('/').pop(),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const r=await fetch('/api/profile/'+encodeURIComponent(u));const d=await r.json();if(!r.ok)return document.body.innerHTML='<h2 style="padding:30px">Profile not found.</h2>';profile.innerHTML=`<div class="profile"><img class="avatar" src="${d.user.profileImage||'/images/brave-lion.png'}"><h1>${esc(d.user.fullname)}</h1><p><b>@${esc(d.user.username)}</b> · ${esc(d.user.country)}</p><p>Shareable profile: ${esc(d.profileUrl)}</p></div>`;posts.innerHTML=d.posts.map(p=>`<div class="card"><b>${esc(p.fullname)}</b><p>${esc(p.text)}</p>${p.media_data?(p.media_type.startsWith('video')?`<video class="media" controls src="${p.media_data}"></video>`:`<img class="media" src="${p.media_data}">`):''}</div>`).join('')||'<div class="card">No public posts yet.</div>';products.innerHTML=d.products.map(p=>`<div class="card"><h3>${esc(p.name)}</h3><p>${esc(p.description)}</p></div>`).join('')||'<div class="card">No products yet.</div>';services.innerHTML=d.services.map(s=>`<div class="card"><h3>${esc(s.name)}</h3><p>${esc(s.description)}</p></div>`).join('')||'<div class="card">No services yet.</div>'}load()</script><script src="/app.js"></script></body></html>
