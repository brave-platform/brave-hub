<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BRAVE Marketplace</title><style>body{font-family:Arial;margin:0;background:#f7f3fb;color:#24162f}header{background:#32105f;color:#fff;padding:18px 5%;display:flex;justify-content:space-between;align-items:center}main{padding:25px 5%}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.card{background:#fff;border-radius:18px;padding:18px;border:1px solid #e8ddf0}.media{width:100%;height:190px;object-fit:cover;border-radius:12px}.pill{background:#eee3f8;color:#32105f;padding:5px 8px;border-radius:999px;font-size:12px}@media(max-width:700px){.cards{grid-template-columns:1fr}}</style></head><body><header><b>🦁 UNIQUE BRAVE MARKETPLACE</b><a href="/login.html" style="color:#ffd83d">Login</a></header><main><h1>Products</h1><div id="products" class="cards"></div><h1>Services</h1><div id="services" class="cards"></div></main><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const q=new URLSearchParams(location.search).get('q')||'';let p,s;if(q){const r=await fetch('/api/search?q='+encodeURIComponent(q));const d=await r.json();p=d.products||[];s=d.services||[]}else{[p,s]=await Promise.all([(await fetch('/api/products')).json(),(await fetch('/api/services')).json()])}$('products').innerHTML=p.map(x=>`<div class="card">${x.image_data?`<img class="media" src="${x.image_data}">`:''}<h3>${esc(x.name)} ${x.featured?'<span class="pill">Featured</span>':''}</h3><p>${esc(x.description)}</p><p>Seller: <a href="/u/${encodeURIComponent(x.owner_username)}">@${esc(x.owner_username)}</a></p></div>`).join('')||'<div class="card">No products found.</div>';$('services').innerHTML=s.map(x=>`<div class="card">${x.image_data?`<img class="media" src="${x.image_data}">`:''}<h3>${esc(x.name)}</h3><p>${esc(x.description)}</p><p>Provider: <a href="/u/${encodeURIComponent(x.owner_username)}">@${esc(x.owner_username)}</a></p></div>`).join('')||'<div class="card">No services found.</div>'}function $(x){return document.getElementById(x)}load()</script></body></html>
