<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>BRAVE - Forgot Password</title>

    <style>

        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #24103f;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 430px;
            background: #321653;
            padding: 35px;
            border-radius: 18px;
            border: 1px solid #5b3180;
            box-shadow: 0 15px 40px rgba(0,0,0,0.35);
            color: white;
        }

        h1 {
            text-align: center;
            margin-bottom: 8px;
            letter-spacing: 3px;
        }

        .subtitle {
            text-align: center;
            color: #cdbddd;
            margin-bottom: 28px;
            line-height: 1.5;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #69428a;
            border-radius: 9px;
            background: #211039;
            color: white;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #9b6bc0;
        }

        input::placeholder {
            color: #9d8cab;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 13px;
            border: none;
            border-radius: 9px;
            background: #70429a;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #8555b0;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
            line-height: 1.4;
            min-height: 20px;
        }

        .back {
            text-align: center;
            margin-top: 22px;
        }

        .back a {
            color: white;
            font-weight: bold;
            text-decoration: none;
        }

        .back a:hover {
            text-decoration: underline;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>BRAVE</h1>

        <p class="subtitle">
            Enter your email and we'll send you a password reset link.
        </p>

        <form id="forgotForm">

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your BRAVE email"
                required
            >

            <button type="submit">
                Send Reset Link
            </button>

        </form>

        <p id="message"></p>

        <div class="back">
            <a href="login.html">
                ← Back to Login
            </a>
        </div>

    </div>


    <script>

        document
            .getElementById("forgotForm")
            .addEventListener("submit", async function(event) {

                event.preventDefault();

                const email =
                    document.getElementById("email").value.trim();

                const message =
                    document.getElementById("message");

                message.textContent =
                    "Sending reset link...";

                try {

                    const response =
                        await fetch("/forgot-password", {

                            method: "POST",

                            headers: {
                                "Content-Type": "application/json"
                            },

                            body: JSON.stringify({
                                email: email
                            })

                        });


                    const result =
                        await response.json();


                    message.textContent =
                        result.message;


                    if (response.ok) {

                        message.style.color = "#9ee493";

                    } else {

                        message.style.color = "#ff9999";

                    }

                }

                catch (error) {

                    console.error(error);

                    message.textContent =
                        "Unable to connect to the server.";

                    message.style.color = "#ff9999";

                }

            });

    </script>

</body>

</html>
