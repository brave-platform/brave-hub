<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forgot Password | UNIQUE BRAVE</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#32105f;font-family:Arial;padding:20px}.box{width:min(430px,100%);background:#fff;padding:25px;border-radius:22px;color:#24162f}.logo{width:100px;display:block;margin:auto}input,button{width:100%;padding:14px;margin-top:10px;box-sizing:border-box;border-radius:11px}input{border:2px solid #e4d6ef}button{border:0;background:#ffd83d;font-weight:800}</style><link rel="stylesheet" href="/app.css"><link rel="manifest" href="/manifest.json"></head><body><div class="box"><img class="logo" src="images/brave-lion.png"><h2>Reset password</h2><p>Enter your account email. If it belongs to UNIQUE BRAVE, we will send a reset link when email delivery is configured.</p><input id="email" type="email" placeholder="Email"><button onclick="send()">Send reset link</button><p id="msg"></p><a href="/login.html">Back to login</a></div><script>async function send(){const r=await fetch('/forgot-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value})});const d=await r.json();msg.textContent=d.message;if(d.resetUrl){msg.innerHTML=d.message+'<br><a href="'+d.resetUrl+'">Open reset link</a>'}}</script><script src="/app.js"></script>
</body></html>
