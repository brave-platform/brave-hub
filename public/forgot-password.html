<script>
async function send(){
  const emailInput=document.getElementById('email');
  const msg=document.getElementById('msg');
  const button=document.querySelector('button');

  if(!emailInput.value.trim()){
    msg.textContent='Please enter your email address.';
    return;
  }

  button.disabled=true;
  button.textContent='Sending...';
  msg.textContent='';

  try{
    const r=await fetch('/forgot-password',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({email:emailInput.value.trim()})
    });

    const d=await r.json();

    if(r.ok){
      msg.innerHTML=
        '<strong>Reset password request received.</strong><br>' +
        'If this email belongs to a UNIQUE BRAVE account, ' +
        'a reset link has been sent. Please check your inbox and spam/junk folder.' +
        (d.resetUrl ? '<br><br><a href="'+d.resetUrl+'">Open reset link</a>' : '');
    }else{
      msg.textContent=d.message||'We could not send the reset email right now. Please try again later.';
    }
  }catch(e){
    msg.textContent='We could not send the reset email right now. Please try again later.';
  }

  button.disabled=false;
  button.textContent='Send reset link';
}
</script>
