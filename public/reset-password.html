<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>New Password | UNIQUE BRAVE</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#32105f;font-family:Arial;padding:20px}.box{width:min(430px,100%);background:#fff;padding:25px;border-radius:22px;color:#24162f}input,button{width:100%;padding:14px;margin-top:10px;box-sizing:border-box;border-radius:11px}input{border:2px solid #e4d6ef}button{border:0;background:#ffd83d;font-weight:800}.password-wrap{position:relative}.password-wrap input{padding-right:58px}.showpass{position:absolute;right:7px;top:16px;border:0;border-radius:9px;padding:8px;background:#eee3f8;font-weight:800}</style><link rel="stylesheet" href="/app.css"><link rel="manifest" href="/manifest.json"></head><body><div class="box"><h2>Create new password</h2><div class="password-wrap"><input id="password" type="password" placeholder="New password"><button type="button" class="showpass" onclick="togglePass('password',this)">Show</button></div><div class="password-wrap"><input id="confirm" type="password" placeholder="Confirm password"><button type="button" class="showpass" onclick="togglePass('confirm',this)">Show</button></div><button onclick="reset()">Save password</button><p id="msg"></p><div id="resetSupportPanel" style="margin-top:18px;padding:15px;border:1px solid #eadff2;border-radius:14px;background:#faf7fd;text-align:left"><b>💬 Need help from UNIQUE BRAVE Customer Service?</b><p style="font-size:13px;color:#75697e">Send a message directly without leaving this page.</p><input id="supportName" placeholder="Your name" style="width:100%;padding:10px;box-sizing:border-box;margin:5px 0;border:2px solid #e5d8ef;border-radius:9px"><input id="supportEmail" type="email" placeholder="Email (optional)" style="width:100%;padding:10px;box-sizing:border-box;margin:5px 0;border:2px solid #e5d8ef;border-radius:9px"><textarea id="supportMessage" rows="3" placeholder="What do you need help with?" style="width:100%;padding:10px;box-sizing:border-box;margin:5px 0;border:2px solid #e5d8ef;border-radius:9px"></textarea><button type="button" onclick="sendResetPageSupport()" style="width:100%;padding:12px;border:0;border-radius:10px;background:#ffd83d;color:#32105f;font-weight:800">📨 Send message to Customer Service</button><p id="supportMsg" style="font-size:13px"></p></div></div><script>function togglePass(id,b){const i=document.getElementById(id);i.type=i.type==='password'?'text':'password';b.textContent=i.type==='password'?'Show':'Hide'}const token=new URLSearchParams(location.search).get('token');async function reset(){const p=document.getElementById('password'),c=document.getElementById('confirm'),m=document.getElementById('msg'),b=document.querySelector('button');if(p.value.length<8){m.textContent='Password must contain at least 8 characters.';return}if(p.value!==c.value){m.textContent='Passwords do not match.';return}b.disabled=true;b.textContent='Saving password…';try{const r=await fetch('/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password:p.value})});const d=await r.json();m.textContent=d.message||'Done';if(r.ok)setTimeout(()=>location.href='/login.html',800);else{b.disabled=false;b.textContent='Save password'}}catch(e){m.textContent='We could not reset the password. Please try again.';b.disabled=false;b.textContent='Save password'}}</script><script src="/app.js"></script><script>async function sendResetPageSupport(){const n=document.getElementById('supportName'),e=document.getElementById('supportEmail'),m=document.getElementById('supportMessage'),out=document.getElementById('supportMsg');const u=(()=>{try{return JSON.parse(localStorage.getItem('braveUser')||'{}')}catch{return{}}})();if(!n.value.trim()&&u.fullname)n.value=u.fullname;if(!e.value.trim()&&u.email)e.value=u.email;if(!n.value.trim()||!m.value.trim()){out.textContent='Enter your name and message.';return}const b=document.querySelector('#resetSupportPanel button');b.disabled=true;b.textContent='Sending…';try{const r=await fetch('/api/customer-service/live/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n.value.trim(),email:e.value.trim(),phone:u.phone||'',subject:'Help from password reset page',message:m.value.trim()})});const d=await r.json();if(!r.ok){out.textContent=d.message||'Could not send your message.';b.disabled=false;b.textContent='📨 Send message to Customer Service';return}localStorage.setItem('braveSupportToken',d.accessToken);out.innerHTML='<b>Message sent successfully.</b> <a href="/customer-service.html">Open Customer Service conversation</a>';m.value='';b.disabled=false;b.textContent='📨 Send message to Customer Service';}catch(e){out.textContent='Could not reach Customer Service. Please try again.';b.disabled=false;b.textContent='📨 Send message to Customer Service';}}</script></body></html>
