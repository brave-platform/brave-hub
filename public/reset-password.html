<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>New Password | UNIQUE BRAVE</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#32105f;font-family:Arial;padding:20px}.box{width:min(430px,100%);background:#fff;padding:25px;border-radius:22px;color:#24162f}input,button{width:100%;padding:14px;margin-top:10px;box-sizing:border-box;border-radius:11px}input{border:2px solid #e4d6ef}button{border:0;background:#ffd83d;font-weight:800}</style><link rel="stylesheet" href="/app.css"><link rel="manifest" href="/manifest.json"></head><body><div class="box"><h2>Create new password</h2><input id="password" type="password" placeholder="New password"><input id="confirm" type="password" placeholder="Confirm password"><button onclick="reset()">Save password</button><p id="msg"></p></div><script>const token=new URLSearchParams(location.search).get('token');async function reset(){if(password.value!==confirm.value)return msg.textContent='Passwords do not match.';const r=await fetch('/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password:password.value})});const d=await r.json();msg.textContent=d.message;if(r.ok)setTimeout(()=>location.href='/login.html',800)}</script><script src="/app.js"></script></body></html>
