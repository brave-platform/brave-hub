<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>BRAVE Login</title>

    <style>

        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;

            background:
                radial-gradient(
                    circle at top,
                    #70429a,
                    #321653 45%,
                    #24103f 100%
                );

            color: white;
        }

        .container {
            width: 100%;
            max-width: 440px;

            background: #321653;

            border: 1px solid #70429a;

            border-radius: 24px;

            padding: 32px 28px;

            box-shadow:
                0 18px 50px rgba(0, 0, 0, 0.45);
        }

        .logo {
            text-align: center;
            margin-bottom: 8px;
        }

        .logo img {
            width: 105px;
            height: 105px;
            object-fit: contain;
        }

        h1 {
            text-align: center;

            margin: 5px 0;

            color: #d4af37;

            font-size: 32px;

            letter-spacing: 3px;
        }

        .subtitle {
            text-align: center;

            color: #ddd;

            font-size: 14px;

            margin-bottom: 25px;
        }

        label {
            display: block;

            margin: 15px 0 7px;

            color: #f4e7c1;

            font-weight: bold;
        }

        input {
            width: 100%;

            padding: 15px;

            border-radius: 12px;

            border: 2px solid #d4af37;

            outline: none;

            background: white;

            color: #24103f;

            font-size: 16px;
        }

        input::placeholder {
            color: #666;
        }

        input:focus {
            border-color: #f1d36b;

            box-shadow:
                0 0 10px rgba(212, 175, 55, 0.35);
        }

        /* PASSWORD AREA */

        .password-box {
            position: relative;
        }

        #password {
            background: white;

            color: #24103f;

            padding-right: 75px;
        }

        .show-btn {
            position: absolute;

            right: 8px;

            top: 8px;

            padding: 8px 11px;

            border: none;

            border-radius: 8px;

            background: #70429a;

            color: white;

            font-weight: bold;

            cursor: pointer;
        }

        .show-btn:hover {
            background: #8a59b5;
        }

        .login-btn {
            width: 100%;

            margin-top: 25px;

            padding: 15px;

            border: none;

            border-radius: 12px;

            background:
                linear-gradient(
                    135deg,
                    #d4af37,
                    #f1d36b
                );

            color: #24103f;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        .login-btn:hover {
            box-shadow:
                0 8px 20px rgba(212, 175, 55, 0.25);
        }

        .login-btn:disabled {
            opacity: 0.65;

            cursor: not-allowed;
        }

        .message {
            display: none;

            margin-top: 15px;

            padding: 12px;

            border-radius: 10px;

            text-align: center;

            font-size: 14px;
        }

        .success {
            display: block;

            background: rgba(46, 204, 113, 0.15);

            border: 1px solid #2ecc71;

            color: #8ff0b5;
        }

        .error {
            display: block;

            background: rgba(231, 76, 60, 0.15);

            border: 1px solid #e74c3c;

            color: #ffaaa3;
        }

        .links {
            text-align: center;

            margin-top: 22px;

            line-height: 2.2;
        }

        .links a {
            color: #d4af37;

            font-weight: bold;

            text-decoration: none;
        }

        .links a:hover {
            text-decoration: underline;
        }

        .divider {
            border-top:
                1px solid rgba(255,255,255,0.12);

            margin: 12px 0;
        }

        .home-link {
            display: block;

            text-align: center;

            margin-top: 18px;

            color: #ccc;

            text-decoration: none;

            font-size: 14px;
        }

        .home-link:hover {
            color: #d4af37;
        }

        @media (max-width: 480px) {

            .container {
                padding: 25px 20px;
            }

            h1 {
                font-size: 28px;
            }

        }

    </style>

</head>


<body>


<div class="container">


    <!-- BRAVE LOGO -->

    <div class="logo">

        <img
            src="images/brave-lion.png"
            alt="BRAVE Lion"
            onerror="this.style.display='none'"
        >

    </div>


    <h1>
        BRAVE
    </h1>


    <div class="subtitle">
        Login to your BRAVE account
    </div>


    <!-- LOGIN FORM -->

    <form id="loginForm">


        <label for="email">
            Email Address
        </label>

        <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            autocomplete="email"
            required
        >


        <label for="password">
            Password
        </label>


        <div class="password-box">

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
            >

            <button
                type="button"
                class="show-btn"
                onclick="togglePassword()"
            >
                Show
            </button>

        </div>


        <button
            type="submit"
            class="login-btn"
            id="loginBtn"
        >
            🔐 Login
        </button>


    </form>


    <!-- MESSAGE -->

    <div
        id="message"
        class="message">
    </div>


    <!-- ACCOUNT RECOVERY -->

    <div class="links">

        <div>

            🔑
            <a href="forgot-password.html">
                Reset Password
            </a>

        </div>


        <div>

            📧
            <a href="forgot-email.html">
                Forgot Email?
            </a>

        </div>


        <div class="divider"></div>


        <div>

            Don't have an account?

            <a href="index.html">
                Create Account
            </a>

        </div>

    </div>


    <!-- HOME -->

    <a
        href="home.html"
        class="home-link"
    >
        ← Back to BRAVE Home
    </a>


</div>


<script>


/* =====================================================
   SHOW / HIDE PASSWORD
===================================================== */

function togglePassword() {

    const password =
        document.getElementById("password");

    const button =
        document.querySelector(".show-btn");


    if (password.type === "password") {

        password.type = "text";

        button.textContent = "Hide";

    } else {

        password.type = "password";

        button.textContent = "Show";

    }

}


/* =====================================================
   LOGIN
===================================================== */

const loginForm =
    document.getElementById("loginForm");

const loginBtn =
    document.getElementById("loginBtn");

const message =
    document.getElementById("message");


loginForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const email =
            document
                .getElementById("email")
                .value
                .trim();


        const password =
            document
                .getElementById("password")
                .value;


        message.className =
            "message";

        message.textContent = "";


        loginBtn.disabled = true;

        loginBtn.textContent =
            "Logging in...";


        try {

            const response =
                await fetch(
                    "/login",
                    {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({
                                email,
                                password
                            })

                    }
                );


            const data =
                await response.json();


            if (response.ok) {

                /*
                   Save the logged-in user
                   without the password.
                */

                localStorage.setItem(
                    "braveUser",
                    JSON.stringify(data.user)
                );


                message.className =
                    "message success";

                message.textContent =
                    "✅ Login successful!";


                setTimeout(
                    function() {

                        window.location.href =
                            "dashboard.html";

                    },
                    700
                );


            } else {

                message.className =
                    "message error";

                message.textContent =
                    "❌ " +
                    (
                        data.message ||
                        "Invalid email or password."
                    );

            }


        } catch (error) {

            console.error(
                "Login error:",
                error
            );


            message.className =
                "message error";

            message.textContent =
                "❌ Unable to connect to server. Please make sure the BRAVE backend is running.";

        }


        loginBtn.disabled = false;

        loginBtn.textContent =
            "🔐 Login";

    }
);

</script>


</body>

</html>
