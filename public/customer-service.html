<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UNIQUE BRAVE — Customer Service</title><link rel="stylesheet" href="/app.css"><link rel="manifest" href="/manifest.json"><style>body{margin:0;background:#f7f3fb;color:#24162f;font-family:Arial}.wrap{max-width:1050px;margin:auto;padding:20px}.hero{background:linear-gradient(135deg,#32105f,#7027c8);color:#fff;border-radius:22px;padding:22px}.card{background:#fff;border:1px solid #eadff2;border-radius:18px;padding:16px;margin:12px 0}textarea,input{width:100%;box-sizing:border-box;padding:12px;border:2px solid #e5d8ef;border-radius:10px}.btn{border:0;border-radius:10px;padding:10px 14px;background:#ffd83d;font-weight:800}.wa{background:#efe7dc;padding:12px;border-radius:14px}.bubble{background:#fff;padding:10px 12px;border-radius:13px;margin:7px 0;max-width:80%}.muted{color:#75697e}</style></head><body><div class="wrap"><div class="hero"><h1>💬 UNIQUE BRAVE Customer Service</h1><p>Limited support workspace. You cannot access administrative controls from here.</p></div><div id="identity" class="card">Checking access…</div><div id="requests"></div></div><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const tok=()=>localStorage.getItem('braveToken')||'';async function api(u,o={}){o.headers={...(o.headers||{}),Authorization:'Bearer '+tok()};if(o.body)o.headers['Content-Type']='application/json';const r=await fetch(u,o);let d={};try{d=await r.json()}catch{};return{r,d}}async function load(){const me=await api('/api/customer-service/me');if(!me.r.ok){document.getElementById('identity').innerHTML='<b>Customer-service access is not enabled for this account.</b>';return}document.getElementById('identity').innerHTML=`<b>${esc(me.d.user.fullname)}</b> · @${esc(me.d.user.username)} · ${esc(me.d.role.role)}`;const x=await api('/api/customer-service/requests');document.getElementById('requests').innerHTML=(x.d.requests||[]).map(r=>`<div class="card"><h3>${esc(r.subject)} · ${esc(r.status)}</h3><p>${esc(r.fullname)} (@${esc(r.username)})</p><p>${esc(r.description)}</p><textarea id="csr-${esc(r.public_id)}" placeholder="Reply to the customer"></textarea><button class="btn" onclick="reply('${esc(r.public_id)}')">Send reply</button></div>`).join('')||'<div class="card">No customer requests.</div>'}async function reply(id){const x=await api('/api/customer-service/requests/'+encodeURIComponent(id)+'/reply',{method:'POST',body:JSON.stringify({message:document.getElementById('csr-'+id).value})});alert(x.d.message||'Done');load()}load();</script><script src="/app.js"></script></body></html>
