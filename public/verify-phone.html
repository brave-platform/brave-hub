<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verify Phone | Unique BRAVE</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#1a0730,#5b20a8);font-family:Arial;color:white;padding:20px}.box{width:min(440px,100%);background:#241039;border:1px solid #ffd34d;border-radius:22px;padding:30px;box-shadow:0 18px 50px #0008}h1{color:#ffd34d;text-align:center}.logo{display:block;margin:auto;width:130px;height:130px;object-fit:contain}input,button{width:100%;padding:14px;border-radius:10px;margin-top:12px;font-size:16px;box-sizing:border-box}input{border:2px solid #ffd34d}button{border:0;background:#ffd34d;color:#241039;font-weight:800}.secondary{background:#5b2394;color:white}.msg{text-align:center;margin-top:14px;line-height:1.5}</style></head><body><div class="box"><img class="logo" src="images/brave-lion.png"><h1>Verify your phone</h1><p>Enter the 6-digit code sent to your phone.</p><input id="phone" placeholder="+2348012345678"><input id="code" inputmode="numeric" maxlength="6" placeholder="6-digit OTP"><button onclick="send('sms')">Send SMS OTP</button><button class="secondary" onclick="send('call')">Verify by phone call</button><button onclick="verify()">Verify phone</button><div id="msg" class="msg"></div></div><script>const p=new URLSearchParams(location.search).get('phone');if(p)phone.value=p;async function send(channel){msg.textContent='Sending...';try{let r=await fetch('/api/phone/send-otp',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:phone.value,channel})});let d=await r.json();msg.textContent=d.message}catch(e){msg.textContent='Unable to send verification.'}}async function verify(){msg.textContent='Checking...';try{let r=await fetch('/api/phone/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:phone.value,code:code.value})});let d=await r.json();msg.textContent=d.message;if(r.ok)setTimeout(()=>location.href='/login.html',800)}catch(e){msg.textContent='Unable to verify phone.'}}</script></body></html>
