<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Phone Verification | BRAVE</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#32105f;font-family:Arial;color:#fff;padding:20px}.box{background:#fff;color:#24162f;width:min(450px,100%);padding:25px;border-radius:22px}.btn{padding:12px;border:0;border-radius:10px;background:#ffd83d;font-weight:800;margin:5px 0;width:100%}input{padding:12px;width:100%;box-sizing:border-box;margin:5px 0}</style></head><body><div class="box"><h2>Phone verification</h2><p>Phone verification is optional when BRAVE's Twilio service is not configured.</p><input id="phone" placeholder="+2348012345678"><input id="code" maxlength="6" placeholder="OTP"><button class="btn" onclick="send('sms')">Send SMS OTP</button><button class="btn" onclick="send('call')">Verify by phone call</button><button class="btn" onclick="verify()">Verify phone</button><p id="msg"></p></div><script>phone.value=new URLSearchParams(location.search).get('phone')||'';async function send(channel){const r=await fetch('/api/phone/send-otp',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:phone.value,channel})});const d=await r.json();msg.textContent=d.message||'Done'}async function verify(){const r=await fetch('/api/phone/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:phone.value,code:code.value})});const d=await r.json();msg.textContent=d.message||'Done';if(r.ok&&d.verified)setTimeout(()=>location.href='/login.html',800)}</script></body></html>
