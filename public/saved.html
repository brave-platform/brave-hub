<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UNIQUE BRAVE — Saved Listings</title><link rel="stylesheet" href="/app.css"><style>body{margin:0;background:#f7f3fb;font-family:Arial;color:#24162f}.top{background:#32105f;color:#fff;padding:16px 5%;display:flex;justify-content:space-between}.top a{color:#ffd83d}.wrap{max-width:1100px;margin:auto;padding:25px 5%}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.card{background:#fff;border:1px solid #eadff2;border-radius:20px;padding:18px}.btn{border:0;border-radius:11px;padding:10px 13px;background:#ffd83d;font-weight:800;cursor:pointer}.secondary{background:#eee3f8}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><header class="top"><b>🦁 Saved on UNIQUE BRAVE</b><a href="/dashboard.html">My BRAVE</a></header><main class="wrap"><h1>Saved listings</h1><p>Private to your account. Save products or services you want to revisit.</p><div id="list" class="grid"></div></main><script>
const token=()=>localStorage.getItem('braveToken')||'';async function load(){const r=await fetch('/api/saved-listings',{headers:{Authorization:'Bearer '+token()},credentials:'include'});if(!r.ok){list.innerHTML='<div class="card">Please sign in.</div>';return}const d=await r.json();if(!d.items.length){list.innerHTML='<div class="card">No saved listings yet. Open a product or service and save it.</div>';return}list.innerHTML=d.items.map(x=>`<div class="card"><span>${x.listing_type==='product'?'📦':'🧑‍💼'}</span><h3>${x.listing_type} listing</h3><p class="muted">${x.listing_id}</p><button class="btn" onclick="openItem('${x.listing_type}','${x.listing_id}')">Open</button> <button class="btn secondary" onclick="removeItem('${x.listing_type}','${x.listing_id}')">Remove</button></div>`).join('')}function openItem(t,id){location.href=(t==='product'?'/products.html':'/services.html')+'?listing='+encodeURIComponent(id)}async function removeItem(t,id){await fetch('/api/saved-listings/'+t+'/'+encodeURIComponent(id),{method:'DELETE',headers:{Authorization:'Bearer '+token()},credentials:'include'});load()}load()
</script></body></html>
