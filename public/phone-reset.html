<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Phone Password Reset | BRAVE</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#1b0730,#5b20a8);font-family:Arial;color:#fff;padding:20px}.box{width:min(440px,100%);background:#241039;padding:30px;border-radius:22px;border:1px solid #ffd34d}h1{color:#ffd34d}input,button{width:100%;box-sizing:border-box;padding:14px;margin-top:12px;border-radius:10px;font-size:16px}input{border:2px solid #ffd34d}button{border:0;background:#ffd34d;font-weight:800}.msg{margin-top:15px;line-height:1.5;text-align:center}</style></head><body><div class="box"><h1>Reset password by phone</h1><p>Use the phone number already linked to your BRAVE account.</p><input id="phone" placeholder="+2348012345678"><button onclick="send()">Send OTP</button><input id="code" placeholder="OTP" inputmode="numeric" maxlength="6"><input id="password" type="password" placeholder="New password"><input id="confirm" type="password" placeholder="Confirm password"><button onclick="resetIt()">Reset Password</button><div id="msg" class="msg"></div><p><a href="login.html" style="color:#ffd34d">Back to login</a></p></div><script>async function send(){msg.textContent='Sending...';let r=await fetch('/forgot-password-phone',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:phone.value})});let d=await r.json();msg.textContent=d.message}async function resetIt(){if(password.value!==confirm.value)return msg.textContent='Passwords do not match.';let r=await fetch('/reset-password-phone',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:phone.value,code:code.value,password:password.value})});let d=await r.json();msg.textContent=d.message;if(r.ok)setTimeout(()=>location.href='login.html',900)}</script></body></html>
