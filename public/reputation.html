<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UNIQUE BRAVE — Reputation</title><link rel="stylesheet" href="/app.css"><style>body{margin:0;background:#f7f3fb;font-family:Arial;color:#24162f}.top{background:#32105f;color:#fff;padding:16px 5%;display:flex;justify-content:space-between}.top a{color:#ffd83d}.wrap{max-width:900px;margin:auto;padding:25px 5%}.card{background:#fff;border:1px solid #eadff2;border-radius:20px;padding:20px;margin:15px 0}.score{font-size:56px;font-weight:900;color:#7027c8}.btn{border:0;border-radius:11px;padding:11px 14px;background:#ffd83d;font-weight:900;cursor:pointer}</style></head><body><header class="top"><b>🦁 UNIQUE BRAVE · Reputation</b><a href="/dashboard.html">My BRAVE</a></header><main class="wrap"><div id="app" class="card">Loading…</div></main><script>
const token=()=>localStorage.getItem('braveToken')||'';async function load(){const r=await fetch('/api/account/reputation',{headers:{Authorization:'Bearer '+token()},credentials:'include'});if(!r.ok){app.innerHTML='Please sign in.';return}const d=await r.json();app.innerHTML=`<h1>Your reputation</h1><div class="score">⭐ ${Number(d.rating||0).toFixed(1)}</div><p>${d.reviews} profile reviews</p><p>Products: ${d.products} · Services: ${d.services} · Timeline posts: ${d.posts}</p><p>Keep your profile accurate, respond professionally and maintain clear listings.</p><button class="btn" onclick="location.href='/profile.html'">Open my profile</button>`}load()
</script></body></html>
