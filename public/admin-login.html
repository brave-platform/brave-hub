<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UNIQUE BRAVE — Admin Login</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#32105f,#8d46d7);font-family:Arial;color:#fff;padding:20px}.box{width:min(430px,100%);background:#fff;color:#24162f;border-radius:25px;padding:28px;box-shadow:0 20px 60px #0005}.logo{display:block;margin:auto;width:120px;height:120px;object-fit:contain}h1{text-align:center;color:#32105f}input{width:100%;padding:14px;margin:7px 0;border:2px solid #e3d5ed;border-radius:12px;box-sizing:border-box}.btn{width:100%;padding:14px;border:0;border-radius:12px;background:#ffd83d;color:#241039;font-weight:800;margin-top:10px}.msg{text-align:center;margin-top:12px}.back{text-align:center;display:block;margin-top:15px;color:#7027c8}</style><link rel="stylesheet" href="/app.css"><link rel="manifest" href="/manifest.json"></head><body><div class="box"><img class="logo" src="/images/brave-logo.png"><h1>UNIQUE BRAVE Administrator</h1><p style="text-align:center">Secure administration centre</p><input id="email" type="email" placeholder="Admin email"><input id="password" type="password" placeholder="Admin password"><button class="btn" onclick="login()">Sign in</button><div id="msg" class="msg"></div><a class="back" href="/">Back to UNIQUE BRAVE</a></div><script>async function login(){msg.textContent='Signing in...';const r=await fetch('/admin-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})});const d=await r.json();if(r.ok){localStorage.setItem('braveAdminToken',d.token);location.href='/admin.html'}else msg.textContent=d.message||'Login failed.'}</script><script src="/app.js"></script></body></html>
