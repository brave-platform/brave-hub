<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>BRAVE Admin Login</title>

    <style>

        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;

            background:
                radial-gradient(
                    circle at top,
                    #70429a,
                    #24103f 55%,
                    #12091f
                );

            color: white;
        }

        .box {
            width: 100%;
            max-width: 420px;

            background: #321653;

            border: 1px solid #70429a;

            border-radius: 22px;

            padding: 35px 28px;

            box-shadow:
                0 20px 50px rgba(0,0,0,0.5);
        }

        .logo {
            text-align: center;
        }

        .logo img {
            width: 105px;
            height: 105px;

            object-fit: contain;

            filter:
                drop-shadow(
                    0 5px 15px
                    rgba(212,175,55,0.25)
                );
        }

        h1 {
            text-align: center;

            color: #d4af37;

            letter-spacing: 2px;

            margin: 8px 0;
        }

        .subtitle {
            text-align: center;

            color: #ddd;

            margin-bottom: 25px;

            line-height: 1.5;
        }

        label {
            display: block;

            margin: 15px 0 7px;

            font-weight: bold;

            color: #f4e7c1;
        }

        input {
            width: 100%;

            padding: 14px;

            border-radius: 11px;

            border: 1px solid #76519b;

            background: #241337;

            color: white;

            outline: none;

            font-size: 15px;
        }

        input::placeholder {
            color: #aaa;
        }

        input:focus {
            border-color: #d4af37;

            box-shadow:
                0 0 8px
                rgba(212,175,55,0.25);
        }

        .password-box {
            position: relative;
        }

        .password-box input {
            padding-right: 75px;
        }

        .show {
            position: absolute;

            right: 7px;
            top: 7px;

            border: none;

            padding: 8px 11px;

            border-radius: 8px;

            background: #70429a;

            color: white;

            cursor: pointer;
        }

        .show:hover {
            background: #8b5ab7;
        }

        .login-btn {
            width: 100%;

            margin-top: 25px;

            padding: 15px;

            border: none;

            border-radius: 11px;

            background:
                linear-gradient(
                    135deg,
                    #d4af37,
                    #f1d36b
                );

            color: #24103f;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        .login-btn:hover:not(:disabled) {
            transform: translateY(-1px);

            box-shadow:
                0 8px 20px
                rgba(212,175,55,0.25);
        }

        .login-btn:disabled {
            opacity: 0.6;

            cursor: not-allowed;
        }

        .message {
            display: none;

            margin-top: 15px;

            padding: 12px;

            border-radius: 10px;

            text-align: center;

            font-size: 14px;

            line-height: 1.5;
        }

        .error {
            display: block;

            background:
                rgba(220,60,60,0.18);

            border: 1px solid #e74c3c;

            color: #ffaaa3;
        }

        .success {
            display: block;

            background:
                rgba(50,180,100,0.15);

            border: 1px solid #42c77a;

            color: #a8f0c2;
        }

        .security {
            margin-top: 20px;

            padding: 12px;

            border-radius: 10px;

            background:
                rgba(255,255,255,0.05);

            border:
                1px solid
                rgba(212,175,55,0.15);

            color: #bbb;

            font-size: 12px;

            line-height: 1.5;

            text-align: center;
        }

        .back {
            display: block;

            text-align: center;

            margin
