<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UNIQUE BRAVE — Products Marketplace</title><link rel="stylesheet" href="/app.css"><style>:root{--p:#32105f;--p2:#7027c8;--g:#ffd83d;--bg:#f7f3fb;--text:#24162f}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,system-ui}header{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;padding:14px 5%;display:flex;align-items:center;justify-content:space-between;gap:12px}header img{width:52px;height:52px;object-fit:contain}header a{color:#ffd83d;font-weight:800;text-decoration:none}.wrap{max-width:1200px;margin:auto;padding:22px 5%}.hero{background:linear-gradient(135deg,var(--p),#9b4fe0);color:#fff;border-radius:24px;padding:25px;margin-bottom:18px}.hero h1{font-size:clamp(28px,5vw,48px);margin:8px 0}.search{width:100%;padding:15px;border:2px solid #e2d5ed;border-radius:14px;box-sizing:border-box;font-size:16px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{background:#fff;border:1px solid #eadff2;border-radius:20px;padding:14px;box-shadow:0 7px 20px #32105f10}.media{width:100%;height:210px;object-fit:cover;border-radius:15px;background:#eee3f8}.price{font-size:22px;font-weight:900;color:var(--p)}.btn{border:0;border-radius:12px;padding:12px 15px;background:var(--g);font-weight:900;cursor:pointer}.pill{display:inline-block;background:#eee3f8;color:var(--p);padding:5px 9px;border-radius:999px;font-size:12px;margin:2px}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.grid{grid-template-columns:1fr 1fr;gap:10px}.media{height:150px}.card{padding:10px}.card h3{font-size:15px}} </style></head><body><header><div style="display:flex;align-items:center;gap:9px"><img src="/images/brave-lion.png"><b>UNIQUE BRAVE</b></div><nav><a href="/dashboard.html">Dashboard</a> · <a href="/marketplace.html">General Marketplace</a></nav></header><main class="wrap"><section class="hero"><span class="pill" style="background:#ffffff22;color:#fff">GOODS & COMMODITIES</span><h1>Products Marketplace</h1><p>A focused shopping space for products, prices, sellers and offers.</p><input id="q" class="search" placeholder="Search products..." oninput="load()"></section><div id="grid" class="grid"></div></main><script>const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>'₦'+Number(n||0).toLocaleString('en-NG');async function load(){const q=$('q').value.trim();let url='/api/products';if(q)url='/api/search?q='+encodeURIComponent(q);const r=await fetch(url);const d=await r.json();let a=d;if(q)a=d.products||[];$('grid').innerHTML=a.map(x=>`<article class="card"><img class="media" src="${x.image_data||x.image_url||'/images/brave-lion.png'}" loading="lazy"><h3>${esc(x.name)} ${x.featured?'<span class="pill">Featured</span>':''}</h3><p>${esc(x.description||'')}</p><span class="pill">${esc(x.category||'')}</span>${x.price!=null?`<p class="price">${money(x.price)}</p>`:''}<p class="pill">${esc(x.location||x.owner_name||'Nigeria')}</p><button class="btn" onclick="openItem('${encodeURIComponent(x.public_id)}')">Open product</button></article>`).join('')||'<div class="card">No matches found.</div>'}function openItem(id){location.href='/product/'+id}load();</script></body></html>
