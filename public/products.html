<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UNIQUE BRAVE — Product Marketplace</title><link rel="stylesheet" href="/app.css"><style>
:root{--p:#32105f;--p2:#7027c8;--g:#ffd83d}body{margin:0;background:#faf7ff;color:#24162f;font-family:Arial,system-ui}.top{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;padding:16px 5%;display:flex;gap:14px;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}.top a{color:#ffd83d;text-decoration:none;font-weight:800}.wrap{max-width:1250px;margin:auto;padding:22px 5%}.hero{background:linear-gradient(135deg,#32105f,#8a45cf);color:#fff;border-radius:26px;padding:30px;display:grid;grid-template-columns:1.4fr .6fr;gap:20px;align-items:center}.hero img{width:180px;justify-self:end}.search{width:100%;padding:15px;border:2px solid #e5d7ef;border-radius:14px;box-sizing:border-box}.chips{display:flex;gap:8px;overflow:auto;padding:14px 0}.chip{border:0;border-radius:999px;background:#fff;padding:10px 14px;box-shadow:0 2px 10px #32105f14;cursor:pointer;white-space:nowrap}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{background:#fff;border:1px solid #eadff2;border-radius:20px;padding:14px;box-shadow:0 5px 20px #32105f0a}.media{width:100%;height:190px;object-fit:cover;border-radius:15px;background:#eee3f8}.price{font-size:21px;font-weight:900;color:var(--p)}.btn{border:0;border-radius:11px;padding:11px 14px;background:var(--g);color:#241039;font-weight:900;cursor:pointer}.secondary{background:#eee3f8;color:var(--p)}.seller{display:flex;gap:8px;align-items:center}.avatar{width:36px;height:36px;border-radius:50%;object-fit:cover;background:#ffd83d}.pill{display:inline-block;padding:5px 8px;border-radius:999px;background:#eee3f8;color:var(--p);font-size:12px;margin:2px}.modal{display:none;position:fixed;inset:0;background:#140823aa;z-index:30;align-items:center;justify-content:center;padding:18px}.modal.open{display:flex}.box{background:#fff;width:min(700px,96vw);max-height:90vh;overflow:auto;border-radius:22px;padding:22px}.muted{color:#75697e}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.hero{grid-template-columns:1fr}.hero img{justify-self:start;width:110px}}@media(max-width:600px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.card{padding:9px}.media{height:125px}.top{flex-wrap:wrap}.hero{padding:22px}.price{font-size:17px}}
</style></head><body><header class="top"><b>🦁 UNIQUE BRAVE · Products</b><nav><a href="/home">Home</a> · <a href="/marketplace.html">All Marketplace</a> · <a href="/services.html">Services</a> · <a href="/dashboard.html">My BRAVE</a></nav></header><main class="wrap"><section class="hero"><div><span class="pill" style="background:#ffffff22;color:#fff">PRODUCT MARKETPLACE</span><h1>Find goods from BRAVE sellers and UNIQUE BRAVE catalogue.</h1><p>Every seller keeps control of their own listing. The platform oversees safety, moderation and marketplace quality.</p><input id="q" class="search" placeholder="Search phones, fashion, electronics, food…" oninput="loadProducts()"></div><img src="/images/brave-lion.png"></section><div id="chips" class="chips"></div><div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap"><h2>Discover products</h2><button class="btn secondary" onclick="loadProducts()">↻ Shuffle listings</button></div><div id="products" class="grid"></div></main><div id="modal" class="modal" onclick="if(event.target===this)closeProduct()"><div class="box"><button class="btn secondary" onclick="closeProduct()">Close</button><div id="content"></div></div></div><script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>'₦'+Number(n||0).toLocaleString('en-NG');let category=new URLSearchParams(location.search).get('category')||'',selectedVariant=null;
const fallback=(p)=>p.image_data||p.image_url||({'Phones & Tablets':'/images/catalog/phone.svg','Computers & Laptops':'/images/catalog/laptop.svg','Electronics':'/images/catalog/headphones.svg','Fashion':'/images/catalog/shirt.svg','Home & Furniture':'/images/catalog/chair.svg','Home':'/images/catalog/chair.svg','Beauty':'/images/catalog/bag.svg'}[p.category]||'/images/brave-lion.png');
const paymentLabel=v=>({pay_on_delivery:'Pay on delivery',pay_after_service:'Pay after service',half_payment:'Half payment',full_payment:'Full payment',disabled:'Payment not enabled — record only'})[v]||'Payment arrangement not specified';
function parseVariants(p){try{const x=JSON.parse(p.variants_json||'[]');return Array.isArray(x)?x:[]}catch{return[]}}
function mediaList(p){const a=[];if(p.image_data||p.image_url)a.push({src:fallback(p),label:'Main'});parseVariants(p).forEach((v,i)=>{if(v.imageData||v.imageUrl)a.push({src:v.imageData||v.imageUrl,label:v.color||v.design||('View '+(i+1))})});return a}
async function loadCats(){const r=await fetch('/api/marketplace/categories'),d=await r.json();$('chips').innerHTML=['',...(d.products||[])].slice(0,16).map(c=>`<button class="chip" onclick="category='${esc(c)}';history.replaceState(null,'','/products.html'+(category?'?category='+encodeURIComponent(category):''));loadProducts()">${c||'All products'}</button>`).join('')}
async function loadProducts(){const q=$('q').value.trim();const url='/api/marketplace/feed?type=product'+(q?'&q='+encodeURIComponent(q):'')+(category?'&category='+encodeURIComponent(category):'');const r=await fetch(url),d=await r.json();$('products').innerHTML=(d.products||[]).map(p=>`<article class="card"><img class="media" src="${fallback(p)}" loading="lazy" onclick="openProduct('${esc(p.public_id)}')" style="cursor:pointer" onerror="this.src='/images/brave-lion.png'"><div><span class="pill">${esc(p.category||'Product')}</span>${p.isUserOwned?'<span class="pill" style="background:#e8fff0;color:#087a3c">USER SELLER</span>':'<span class="pill">BRAVE CATALOGUE</span>'}</div><h3>${esc(p.name)}</h3><p class="price">${p.price!=null?money(p.price):'Contact seller'}</p><p>${esc((p.description||'').slice(0,130))}</p><p class="muted">${esc(paymentLabel(p.payment_method))}${p.delivery_price?` · Delivery ${money(p.delivery_price)}`:''}</p><div class="seller"><img class="avatar" src="${p.ownerProfileImage||'/images/brave-lion.png'}" onerror="this.src='/images/brave-lion.png'"><div><b>${esc(p.owner_name)}</b><small class="muted" style="display:block">${esc(p.ownerLabel)} · @${esc(p.owner_username||'brave')}</small></div></div><div style="display:flex;gap:7px;flex-wrap:wrap;margin-top:10px"><button class="btn" onclick="openProduct('${esc(p.public_id)}')">Open product</button>${p.owner_username?`<a class="btn secondary" href="/u/${encodeURIComponent(p.owner_username)}">Seller profile</a>`:''}${isAdmin()?`<button class="btn" onclick="adminEdit('${esc(p.public_id)}')">✏️ Edit</button>`:''}</div></article>`).join('')||'<div class="card">No products match that search yet.</div>'}
async function openProduct(id){const r=await fetch('/api/products/'+encodeURIComponent(id)),d=await r.json();if(!r.ok)return alert(d.message||'Product unavailable');const p=d.product,vs=parseVariants(p);selectedVariant=vs[0]||null;const imgs=mediaList(p);const colorOptions=[...new Set(vs.map(v=>v.color).filter(Boolean))],designOptions=[...new Set(vs.map(v=>v.design).filter(Boolean))];$('content').innerHTML=`<div class="product-detail"><div><img id="mainProductImage" class="media" style="height:360px;object-fit:contain;background:#f7f3fb;cursor:zoom-in" src="${imgs[0]?.src||fallback(p)}" onclick="zoomProductImage()" onerror="this.src='/images/brave-lion.png'"><div style="display:flex;gap:7px;overflow:auto;margin-top:8px">${imgs.map((m,i)=>`<button class="chip" onclick="selectGallery('${esc(m.src)}')"><img src="${esc(m.src)}" style="width:54px;height:54px;object-fit:cover;border-radius:8px"><small>${esc(m.label)}</small></button>`).join('')}</div></div><div><span class="pill">${esc(p.category)}</span><span class="pill">${p.owner_id&&p.owner_id!=='ADMIN'&&p.owner_id!=='catalog'&&p.owner_id!=='demo'?'USER-OWNED':'UNIQUE BRAVE'}</span><h2>${esc(p.name)}</h2><p id="productPrice" class="price">${money(p.price)}</p><p>${esc(p.description||'')}</p>${colorOptions.length?`<b>Colour</b><div style="display:flex;gap:7px;flex-wrap:wrap;margin:8px 0">${colorOptions.map(c=>`<button class="chip" onclick="chooseVariant('${esc(c)}','color')">${esc(c)}</button>`).join('')}</div>`:''}${designOptions.length?`<b>Design</b><div style="display:flex;gap:7px;flex-wrap:wrap;margin:8px 0">${designOptions.map(c=>`<button class="chip" onclick="chooseVariant('${esc(c)}','design')">${esc(c)}</button>`).join('')}</div>`:''}<p><b>Payment:</b> ${esc(paymentLabel(p.payment_method))} ${p.delivery_price?` · <b>Delivery:</b> ${money(p.delivery_price)}`:''}</p><p><b>Seller:</b> ${esc(p.owner_name)} ${p.owner_username?' · @'+esc(p.owner_username):''}</p>${p.video_data?`<video class="media" controls src="${p.video_data}"></video>`:''}${p.audio_data?`<audio controls style="width:100%;margin:10px 0" src="${p.audio_data}"></audio>`:''}${p.pdf_data?`<a class="btn secondary" href="${p.pdf_data}" target="_blank">📄 Open product file</a>`:''}${p.file_data?`<a class="btn secondary" href="${p.file_data}" download="${esc(p.file_name||'product-file')}">📎 Download file</a>`:''}<div class="safe-banner">Confirm the seller, delivery arrangement and payment terms before paying. BRAVE does not treat a listing as proof of payment.</div><button class="btn" onclick="addProductToCart('${esc(p.public_id)}','${esc(p.name)}',selectedVariant?.price??${Number(p.price||0)},${Number(p.delivery_price||0)},selectedVariant)">🛒 Add to cart</button>${p.owner_username?`<a class="btn secondary" href="/u/${encodeURIComponent(p.owner_username)}">View seller profile</a>`:''}</div></div>`;$('modal').classList.add('open');window.currentProduct=p}
function chooseVariant(value,key){const p=window.currentProduct;if(!p)return;const vs=parseVariants(p);selectedVariant=vs.find(v=>String(v[key]||'')===String(value))||selectedVariant;if(selectedVariant?.imageData||selectedVariant?.imageUrl)selectGallery(selectedVariant.imageData||selectedVariant.imageUrl);if(selectedVariant?.price!=null)$('productPrice').textContent=money(selectedVariant.price)}
function selectGallery(src){$('mainProductImage').src=src}
function zoomProductImage(){const src=$('mainProductImage')?.src;if(src)window.open(src,'_blank','noopener')}
function addProductToCart(id,name,price,delivery,variant){let c=[];try{c=JSON.parse(localStorage.getItem('braveCart')||'[]')}catch(_){}const key=id+'|'+(variant?.color||'')+'|'+(variant?.design||'');const i=c.findIndex(x=>(x.public_id+'|'+(x.color||'')+'|'+(x.design||''))===key);if(i>=0)c[i].quantity=(Number(c[i].quantity)||1)+1;else c.push({public_id:id,name,price:Number(price||0),delivery:Number(delivery||0),quantity:1,color:variant?.color||'',design:variant?.design||'',variant:variant||null});localStorage.setItem('braveCart',JSON.stringify(c));alert('Added to cart. Review your order total before checkout.');}
function isAdmin(){return !!localStorage.getItem('braveAdminToken')}
async function adminEdit(id){if(!isAdmin())return;const r=await fetch('/api/admin/public-listings',{headers:{'x-admin-token':localStorage.getItem('braveAdminToken')}});const d=await r.json();const p=(d.products||[]).find(x=>x.public_id===id);if(!p)return alert('Listing not found.');$('content').innerHTML=`<h2>Edit public product</h2><label>Name</label><input id=aeName value="${esc(p.name)}"><label>Category</label><input id=aeCat value="${esc(p.category)}"><label>Image URL</label><input id=aeImageUrl value="${esc(p.image_url||'')}"><label>Price</label><input id=aePrice type=number value="${Number(p.price||0)}"><label>Stock</label><input id=aeStock type=number value="${Number(p.stock??p.quantity??0)}"><label>Delivery price</label><input id=aeDelivery type=number value="${Number(p.delivery_price||0)}"><label>Payment</label><select id=aePayment><option value="pay_on_delivery">Pay on delivery</option><option value="half_payment">Half payment</option><option value="full_payment">Full payment</option><option value="disabled">Payment not enabled</option></select><label>Description</label><textarea id=aeDesc rows=5>${esc(p.description||'')}</textarea><label>Colour/design variants JSON</label><textarea id=aeVariants rows=7 placeholder='[{"color":"Black","design":"A","price":32000,"stock":5,"imageUrl":"/image.jpg"}]'>${esc(p.variants_json||'[]')}</textarea><button class="btn" onclick="saveAdminEdit('${esc(id)}')">Save changes</button>`;$('aePayment').value=p.payment_method||'pay_on_delivery';$('modal').classList.add('open')}
async function saveAdminEdit(id){const r=await fetch('/api/admin/public-listing/product/'+encodeURIComponent(id),{method:'PATCH',headers:{'Content-Type':'application/json','x-admin-token':localStorage.getItem('braveAdminToken')},body:JSON.stringify({name:$('aeName').value,category:$('aeCat').value,price:$('aePrice').value,stock:$('aeStock').value,deliveryPrice:$('aeDelivery').value,imageUrl:$('aeImageUrl').value,paymentMethod:$('aePayment').value,description:$('aeDesc').value})});if(r.ok){await fetch('/api/admin/public-listing/product/'+encodeURIComponent(id)+'/media',{method:'PATCH',headers:{'Content-Type':'application/json','x-admin-token':localStorage.getItem('braveAdminToken')},body:JSON.stringify({variantsJson:$('aeVariants').value})})}const d=await r.json();alert(d.message||'Done');if(r.ok){closeProduct();loadProducts()}}
function closeProduct(){$('modal').classList.remove('open')}
const initialQ=new URLSearchParams(location.search).get('q')||'';$('q').value=initialQ;loadCats();loadProducts();
</script></script><script src="/app.js"></script></body></html>
