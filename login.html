<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>BRAVE Login</title>


    <style>

        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }


        body {

            margin: 0;

            min-height: 100vh;

            background: #24103f;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 20px;

        }


        .container {

            width: 100%;

            max-width: 430px;

            background: #321653;

            padding: 35px;

            border-radius: 18px;

            border: 1px solid #5b3180;

            box-shadow:
                0 15px 40px rgba(0,0,0,0.35);

            color: white;

        }


        h1 {

            text-align: center;

            margin-bottom: 8px;

            letter-spacing: 3px;

        }


        .subtitle {

            text-align: center;

            color: #cdbddd;

            margin-bottom: 28px;

        }


        label {

            display: block;

            margin-top: 17px;

            margin-bottom: 7px;

            font-weight: bold;

        }


        input {

            width: 100%;

            padding: 13px;

            border: 1px solid #69428a;

            border-radius: 9px;

            background: #211039;

            color: whitish;

            font-size: 15px;

            outline: none;

        }


        input:focus {

            border-color: #9b6bc0;

        }


        input::placeholder {

            color: #9d8cab;

        }


        button {

            width: 100%;

            margin-top: 25px;

            padding: 13px;

            border: none;

            border-radius: 9px;

            background: #70429a;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

        }


        button:hover {

            background: #8555b0;

        }


        #message {

            text-align: center;

            margin-top: 15px;

            font-weight: bold;

            min-height: 20px;

        }


        .register-link {

            text-align: center;

            margin-top: 22px;

            color: #cdbddd;

        }


        .register-link a {

            color: white;

            font-weight: bold;

            text-decoration: none;

        }


        .register-link a:hover {

            text-decoration: underline;

        }

    </style>

</head>


<body>


    <div class="container">


        <h1>BRAVE</h1>


        <p class="subtitle">
            Welcome back
        </p>


        <form id="loginForm">


            <label>
                Email
            </label>


            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required
            >


            <label>
                Password
            </label>


            <input
                type="password"
                name="password"
                placeholder="Enter your password"
                required
            >


            <button type="submit">
                Login
            </button>


        </form>


        <p id="message"></p>


        <p class="register-link">

            Don't have an account?

            <a href="index.html">
                Create Account
            </a>

        </p>


    </div>


    <script>

        document
            .getElementById("loginForm")
            .addEventListener("submit", async function(event) {


                event.preventDefault();


                const formData =
                    new FormData(event.target);


                const data =
                    Object.fromEntries(
                        formData.entries()
                    );


                const message =
                    document.getElementById("message");


                try {


                    const response =
                        await fetch("/login", {

                            method: "POST",

                            headers: {

                                "Content-Type":
                                    "application/json"

                            },

                            body:
                                JSON.stringify(data)

                        });


                    const result =
                        await response.json();


                    if (response.ok) {


                        /* Save complete user information */

                        localStorage.setItem(
                            "braveUser",
                            JSON.stringify(result.user)
                        );


                        message.textContent =
                            "Login successful!";


                        setTimeout(function() {

                            window.location.href =
                                "dashboard.html";

                        }, 500);


                    }

                    else {

                        message.textContent =
                            result.message;

                    }


                }

                catch (error) {

                    message.textContent =
                        "Unable to connect to the server.";

                    console.error(error);

                }


            });

    </script>


</body>

</html>
